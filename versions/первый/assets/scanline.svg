<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5CE1E6" stroke-opacity="0.18"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="24 0" dur="3s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="1200" height="48" fill="#070B14"/>
  <rect width="1200" height="48" fill="url(#grid)"/>
  <rect y="22" width="120" height="4" rx="2" fill="#5CE1E6" fill-opacity="0.85">
    <animate attributeName="x" values="-120;1200" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
